<!-- @dsCard group="Layout" height=300 subtitle="Open and closed" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FAQ</title></head>
<body>
<div class="pv" style="background:var(--bg)">
  <div style="display:grid;gap:4px">
    <details class="ew-details" style="background:var(--surface)" open>
      <summary class="ew-heading text-h3 fg-strong" style="display:flex;align-items:baseline;gap:16px;padding:20px 24px"><span style="flex:1">Do the forms register me for the class?</span><span class="when-closed" aria-hidden="true">+</span><span class="when-open" aria-hidden="true">−</span></summary>
      <div class="ew-measure" style="padding:0 24px 24px;line-height:1.7"><p style="margin:0">No. The forms collect interest. To register, message us on WhatsApp.</p></div>
    </details>
    <details class="ew-details" style="background:var(--surface)">
      <summary class="ew-heading text-h3 fg-strong" style="display:flex;align-items:baseline;gap:16px;padding:20px 24px"><span style="flex:1">Does the Blueprint have live sessions?</span><span class="when-closed" aria-hidden="true">+</span><span class="when-open" aria-hidden="true">−</span></summary>
      <div class="ew-measure" style="padding:0 24px 24px;line-height:1.7"><p style="margin:0">No. The Blueprint is our recorded course.</p></div>
    </details>
  </div>
</div>
</body>
</html>
