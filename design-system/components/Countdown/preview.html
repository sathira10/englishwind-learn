<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Countdown</title></head>
<body>
<div class="pv" style="background:var(--surface)">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px" role="timer" aria-live="off">
    <div style="background:var(--bg);padding:16px 8px;text-align:center"><span class="ew-data" style="display:block;line-height:1">3</span><span class="text-base fg-muted" style="display:block;margin-top:8px">Days</span></div>
    <div style="background:var(--bg);padding:16px 8px;text-align:center"><span class="ew-data" style="display:block;line-height:1">14</span><span class="text-base fg-muted" style="display:block;margin-top:8px">Hours</span></div>
    <div style="background:var(--bg);padding:16px 8px;text-align:center"><span class="ew-data" style="display:block;line-height:1">27</span><span class="text-base fg-muted" style="display:block;margin-top:8px">Mins</span></div>
    <div style="background:var(--bg);padding:16px 8px;text-align:center"><span class="ew-data" style="display:block;line-height:1">9</span><span class="text-base fg-muted" style="display:block;margin-top:8px">Secs</span></div>
  </div>
</div>
</body>
</html>
