<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConsentBanner</title></head>
<body>
<div class="pv">
  <div role="dialog" aria-label="Analytics consent" style="max-width:36rem;border:1px solid var(--line);background:var(--surface);padding:16px">
    <p class="text-base" style="margin:0">We use optional analytics to see which pages are useful. Nothing is loaded until you agree.</p>
    <div style="margin-top:12px;display:flex;gap:12px">
      <button type="button" class="ew-btn ew-btn-primary">Accept</button>
      <button type="button" class="ew-btn ew-btn-secondary">Decline</button>
    </div>
  </div>
</div>
</body>
</html>
