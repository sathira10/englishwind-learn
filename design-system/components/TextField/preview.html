<!-- @dsCard group="Forms" height=220 subtitle="Required and optional" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="pv pv-stack" style="max-width:420px">
  <div style="display:grid;gap:8px">
    <label class="ew-label" for="tf-name">Name</label>
    <input class="ew-field" id="tf-name" type="text" autocomplete="off">
  </div>
  <div style="display:grid;gap:8px">
    <label class="ew-label" for="tf-wa">WhatsApp number <span class="fg-muted" style="font-weight:400">(optional)</span></label>
    <input class="ew-field" id="tf-wa" type="tel" autocomplete="off">
  </div>
</div>
</body>
</html>
