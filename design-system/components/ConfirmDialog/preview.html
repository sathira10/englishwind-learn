<!-- @dsCard group="Overlays" height=300 subtitle="Over the opaque scrim" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConfirmDialog</title></head>
<body>
<div style="background:var(--overlay-scrim);padding:var(--space-6);min-height:260px;display:grid;place-items:center;box-sizing:border-box">
  <div class="ew-dialog" role="dialog" aria-labelledby="cd-title" style="margin:0">
    <h2 id="cd-title" class="text-h3" style="margin:0 0 var(--space-4)">Approve this order?</h2>
    <p style="margin:0 0 var(--space-8);font-size:1rem">The student gets access to the Blueprint and an email saying so.</p>
    <div class="pv-row" style="gap:var(--space-2)"><button class="ew-btn ew-btn-primary" type="button">Approve order</button><button class="ew-btn ew-btn-secondary" type="button">Cancel</button></div>
  </div>
</div>
</body>
</html>
