name: Backup

# Daily copy of D1 and every R2 object, encrypted, kept 30 days as a workflow artifact
# (docs/operations.md, plans/11-backups.md). Runs at 02:00 in Colombo (20:30 UTC).
# Scheduled runs back up production. Run by hand to back up staging or to take an extra copy.
#
# This job deliberately does not use a GitHub environment: `production` requires a reviewer, which
# would stop the nightly run waiting for approval. It reads repository secrets instead.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to back up
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read

concurrency:
  group: backup-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  backup:
    # Only from the default branch: the job holds the Cloudflare and R2 credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Name the backup
        id: name
        run: |
          # The bucket the Worker uses now, read from wrangler.jsonc, so a restore that points the
          # environment at a new bucket (docs/operations.md) is what gets backed up next.
          bucket="$(node --input-type=module -e "
            import { unstable_readConfig } from 'wrangler';
            const config = unstable_readConfig({ env: process.argv[1] });
            const files = config.r2_buckets.find((b) => b.binding === 'FILES');
            if (!files?.bucket_name) throw new Error('no FILES bucket for ' + process.argv[1]);
            process.stdout.write(files.bucket_name);
          " "$TARGET")"
          [ -n "$bucket" ] || { echo "no FILES bucket for $TARGET" >&2; exit 1; }
          echo "Backing up R2 bucket $bucket"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "name=englishwind-learn-$TARGET-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Export D1
        run: |
          mkdir -p work/backup
          pnpm exec wrangler d1 export DB --remote --env "$TARGET" --output work/backup/d1.sql --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler cannot list R2 objects, so use the S3-compatible API (the aws CLI is on the runner).
      - name: Copy R2 objects
        run: |
          mkdir -p work/backup/r2
          aws s3 sync "s3://$BUCKET" work/backup/r2 \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
        env:
          BUCKET: ${{ steps.name.outputs.bucket }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      - name: Check, pack and encrypt
        run: |
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "BACKUP_PASSPHRASE is not set" >&2; exit 1; }
          grep -q '^CREATE TABLE' work/backup/d1.sql || { echo "D1 export has no tables" >&2; exit 1; }
          # A schema-only export must fail the job: require migration rows and the seeded course.
          grep -q 'INSERT INTO "d1_migrations"' work/backup/d1.sql || { echo "D1 export has no data" >&2; exit 1; }
          grep -q 'INSERT INTO "courses"' work/backup/d1.sql || { echo "D1 export has no courses row" >&2; exit 1; }
          objects="$(find work/backup/r2 -type f | wc -l)"
          [ "$objects" -gt 0 ] || echo "::warning::R2 bucket for $TARGET has no objects"
          {
            echo "environment: $TARGET"
            echo "created_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $GITHUB_SHA"
            echo "r2_bucket: $BUCKET"
            echo "d1_tables: $(grep -c '^CREATE TABLE' work/backup/d1.sql)"
            echo "r2_objects: $objects"
          } > work/backup/MANIFEST.txt
          tar -C work -czf work/backup.tar.gz backup
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "work/$NAME.tar.gz.gpg" work/backup.tar.gz
          # Prove the passphrase decrypts it before we trust the copy.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt "work/$NAME.tar.gz.gpg" | tar -tz > /dev/null
          rm -rf work/backup work/backup.tar.gz
        env:
          NAME: ${{ steps.name.outputs.name }}
          BUCKET: ${{ steps.name.outputs.bucket }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: work/${{ steps.name.outputs.name }}.tar.gz.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
